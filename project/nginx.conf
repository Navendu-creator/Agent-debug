server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # The backend accepts JSON bodies up to 1 MB.
    client_max_body_size 2m;

    # Docker's DNS, re-resolved at request time: a recreated backend container (e.g. after editing
    # backend/.env and `docker compose up -d`) gets a new IP, and a fixed upstream would keep the old one.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
